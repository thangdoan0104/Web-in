services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webin
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/webin
      STORAGE_DIR: /data/storage
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/storage
    depends_on:
      - db

volumes:
  db-data:
  uploads:
